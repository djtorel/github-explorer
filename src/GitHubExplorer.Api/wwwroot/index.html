    <script>
      (function () {
        const stored = localStorage.getItem("github-explorer-theme");
        const mode =
          stored ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        if (mode === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
